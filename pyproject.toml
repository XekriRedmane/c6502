[project]
name = "c6502"
version = "0.1.0"
description = "A C99 compiler written in Python and why not"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.3.1",
    "numpy>=2.4.4",
    "pcpp>=1.30",
    "py65>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
